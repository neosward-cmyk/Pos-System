<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard POS</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>


<body>


<header class="top-header">


<div class="brand">

<h1>
📊 Dashboard POS
</h1>

<p>
Analisis Kedai Runcit
</p>

</div>


<div class="sales-box">

Jualan Hari Ini

<br>

<strong id="todaySales">
RM0.00
</strong>


</div>


</header>





<nav>

<button onclick="location.href='index.html'">
🛒 POS
</button>


<button>
📊 Dashboard
</button>


<button onclick="location.href='report.html'">
🧾 Laporan
</button>


</nav>






<main class="dashboard">



<div class="stats">


<div class="stat-card">

<h3>
💰 Jualan
</h3>

<h1 id="sales">
RM0
</h1>

</div>




<div class="stat-card">

<h3>
🧾 Transaksi
</h3>

<h1 id="transaction">
0
</h1>

</div>





<div class="stat-card">

<h3>
📦 Produk
</h3>

<h1 id="products">
0
</h1>

</div>






<div class="stat-card">

<h3>
🔥 Terlaris
</h3>

<h1 id="best">
-
</h1>

</div>



</div>






<section class="chart-box">


<h2>
📈 Jualan 7 Hari
</h2>


<canvas id="salesChart">

</canvas>


</section>







<section class="chart-box">


<h2>
🏆 Produk Paling Laku
</h2>


<canvas id="productChart">

</canvas>


</section>




</main>





<script src="report.js"></script>


</body>

</html>

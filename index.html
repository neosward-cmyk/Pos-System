<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POS Kedai Runcit</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div>
<h1>🛒 POS Kedai Runcit</h1>
<p>Sistem Jualan Harian</p>
</div>


<div class="sales-box">

Jualan Hari Ini

<br>

<b id="todaySales">
RM0.00
</b>

</div>


</header>



<nav>

<button>
🏠 Dashboard
</button>

<button>
📦 Produk
</button>

<button>
🧾 Jualan
</button>

<button>
📊 Laporan
</button>

</nav>




<main class="container">



<section class="products">


<h2>📦 Senarai Produk</h2>


<input 
id="search"
placeholder="🔍 Cari produk..."
onkeyup="displayProducts()">



<div id="productList"></div>




<div class="add-product">


<h3>
➕ Tambah Produk
</h3>


<input 
id="pname"
placeholder="Nama Produk">


<input 
id="price"
type="number"
placeholder="Harga RM">


<input 
id="stock"
type="number"
placeholder="Jumlah Stok">


<button onclick="addProduct()">

Simpan Produk

</button>


</div>



</section>






<section class="cart">


<h2>
🛒 Cart Jualan
</h2>


<div class="cart-info">

Jumlah Item:
<span id="itemCount">
0
</span>


</div>



<div id="cartList">

</div>




<div class="summary">


<h3>

Jumlah:

RM <span id="total">
0.00
</span>

</h3>



<button 
class="checkout"
onclick="checkout()">

💳 Checkout

</button>



</div>



</section>




</main>





<script src="app.js"></script>


</body>

</html>

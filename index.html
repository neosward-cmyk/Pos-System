<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POS Kedai Runcit</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="top-header">


<div class="brand">

<h1>🛒 POS Kedai Runcit</h1>

<p>
Sistem Pengurusan Jualan
</p>

</div>



<div class="status">

<span id="clock">
00:00:00
</span>

<br>

<span class="online">
🟢 Sistem Aktif
</span>


</div>




<div class="sales-box">


Jualan Hari Ini

<br>

<strong id="todaySales">
RM0.00
</strong>


</div>



</header>





<nav>


<button onclick="location.href='dashboard.html'">
🏠 Dashboard
</button>


<button>
📦 Produk
</button>


<button>
🧾 Transaksi
</button>


<button onclick="location.href='dashboard.html'">
📊 Laporan
</button>


<button>
⚙ Tetapan
</button>


  <button onclick="location.href='inventory.html'">

📦 Stok

</button>


<button onclick="location.href='supplier.html'">

🏭 Supplier

</button>


<button onclick="location.href='purchase.html'">

🛒 Pembelian

</button>


</nav>






<main class="container">





<section class="products">



<h2>
📦 Produk
</h2>



<div class="search-area">


<input
id="search"
placeholder="🔍 Cari produk..."
onkeyup="displayProducts()">



<input
id="barcode"
placeholder="🔢 Barcode Produk"
onkeyup="searchBarcode()">


<button onclick="startScanner()">

📷 Scan Barcode

</button>


<div id="scanner">

</div>

</div>




<div id="productList">

</div>








<div class="add-product">


<h3>
➕ Tambah Produk Baru
</h3>

<input
id="productBarcode"
placeholder="Kod Barcode Produk">

<input 
id="pname"
placeholder="Nama Produk">



<input
id="price"
type="number"
placeholder="Harga RM">



<input
id="stock"
type="number"
placeholder="Stok">

  <input
id="cost"
type="number"
placeholder="Harga Modal RM">


<input
id="category"
placeholder="Kategori">


<input
id="supplier"
placeholder="Nama Supplier">



<button onclick="addProduct()">

💾 Simpan Produk

</button>



</div>




</section>









<section class="cart">



<h2>
🛒 Jualan
</h2>



<div class="customer">


<input
placeholder="Nama Pelanggan (optional)"
id="customer">


</div>





<div class="cart-info">


Jumlah Item:

<b id="itemCount">
0
</b>



</div>





<div id="cartList">


</div>








<div class="payment">


<h3>
Jumlah Bayaran
</h3>



<h2>

RM 
<span id="total">
0.00
</span>


</h2>



<select id="paymentMethod">

<option>
Tunai
</option>

<option>
DuitNow QR
</option>

<option>
Kad
</option>

<option>
E-Wallet
</option>


</select>




<button 
class="checkout"
onclick="checkout()">


🧾 Bayar & Cetak Resit


</button>



</div>




</section>







</main>


<script src="https://unpkg.com/html5-qrcode"></script>

<script src="app.js"></script>

<script src="barcode.js"></script>

<script>


function updateClock(){


let now=new Date();


document.getElementById("clock")
.innerHTML=
now.toLocaleTimeString();


}


setInterval(updateClock,1000);


updateClock();


</script>



</body>


</html>

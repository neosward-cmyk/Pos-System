<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POS Kedai Runcit</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="top-header">


<div class="brand">

<h1>🛒 POS Kedai Runcit</h1>

<p>
Sistem Pengurusan Jualan
</p>

</div>



<div class="status">

<span id="clock">
00:00:00
</span>

<br>

<span class="online">
🟢 Sistem Aktif
</span>


</div>




<div class="sales-box">


Jualan Hari Ini

<br>

<strong id="todaySales">
RM0.00
</strong>


</div>



</header>





<nav>


<button>
🏠 Dashboard
</button>


<button>
📦 Produk
</button>


<button>
🧾 Transaksi
</button>


<button>
📊 Laporan
</button>


<button>
⚙ Tetapan
</button>


</nav>






<main class="container">





<section class="products">



<h2>
📦 Produk
</h2>



<div class="search-area">


<input
id="search"
placeholder="🔍 Cari produk..."
onkeyup="displayProducts()">



<input
id="barcode"
placeholder="🔢 Barcode">


</div>




<div id="productList">

</div>








<div class="add-product">


<h3>
➕ Tambah Produk Baru
</h3>



<input 
id="pname"
placeholder="Nama Produk">



<input
id="price"
type="number"
placeholder="Harga RM">



<input
id="stock"
type="number"
placeholder="Stok">



<button onclick="addProduct()">

💾 Simpan Produk

</button>



</div>




</section>









<section class="cart">



<h2>
🛒 Jualan
</h2>



<div class="customer">


<input
placeholder="Nama Pelanggan (optional)"
id="customer">


</div>





<div class="cart-info">


Jumlah Item:

<b id="itemCount">
0
</b>



</div>





<div id="cartList">


</div>








<div class="payment">


<h3>
Jumlah Bayaran
</h3>



<h2>

RM 
<span id="total">
0.00
</span>


</h2>



<select id="paymentMethod">

<option>
Tunai
</option>

<option>
DuitNow QR
</option>

<option>
Kad
</option>

<option>
E-Wallet
</option>


</select>




<button 
class="checkout"
onclick="checkout()">


🧾 Bayar & Cetak Resit


</button>



</div>




</section>







</main>





<script src="app.js"></script>


<script>


function updateClock(){


let now=new Date();


document.getElementById("clock")
.innerHTML=
now.toLocaleTimeString();


}


setInterval(updateClock,1000);


updateClock();


</script>



</body>


</html>

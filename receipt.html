<!DOCTYPE html>

<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Resit Jualan</title>


<style>

body{

font-family:monospace;

background:#eee;

}



.receipt{


width:320px;

margin:30px auto;

background:white;

padding:20px;


}



.center{

text-align:center;

}



.line{

border-top:1px dashed black;

margin:10px 0;

}



.item{

display:flex;

justify-content:space-between;

}



button{


width:100%;

padding:12px;

background:#00994d;

color:white;

border:none;

border-radius:8px;

margin-top:15px;


}



@media print{


button{

display:none;

}


body{

background:white;

}


.receipt{

margin:0;

}


}


</style>


</head>


<body>



<div class="receipt">


<div class="center">


<h2 id="shopName">

KEDAI RUNCIT

</h2>


<p>

Resit Jualan

</p>


</div>



<div class="line"></div>


<p>

No Resit:

<span id="invoice">

</span>

</p>


<p>

Tarikh:

<span id="date">

</span>

</p>


<div class="line"></div>




<div id="items">


</div>



<div class="line"></div>



<div class="item">

<b>
Jumlah
</b>


<b id="total">

RM0.00

</b>


</div>



<div class="item">

Bayaran

<span id="payment">

</span>


</div>



<div class="item">

Baki

<span id="balance">

</span>


</div>



<div class="line"></div>



<div class="center">


<p>
Terima Kasih
</p>


<p>
Sila Datang Lagi 😊
</p>


</div>



<button onclick="window.print()">

🖨 Cetak Resit

</button>



</div>




<script src="receipt.js"></script>


</body>


</html>
